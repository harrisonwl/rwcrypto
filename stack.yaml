# Match the snapshot used by ~/ReWire (GHC 9.10 / base 4.20). rewire-base pins
# base ==4.20.*, so an older LTS (e.g. lts-23.x = GHC 9.8) will NOT resolve.
snapshot: lts-24.46

packages:
- .

# The ReWire libraries this project builds against, referenced in place from the
# local checkout at ~/ReWire. rewire-user provides ReWire / ReWire.Bits / etc.;
# rewire-base is its shared base. All of their Hackage dependencies are already
# in lts-24.46, so no further extra-deps are needed here (the cryptol/solver
# extra-deps in ReWire's own stack.yaml are only for the compiler, not for these
# two libraries).
# Relative to this stack.yaml (i.e. ~/work/rwcrypto). Adjust if ReWire lives
# elsewhere. NOTE: stack does not expand ~ or env vars here, so use an absolute
# path instead if the two repos won't keep this relative layout.
extra-deps:
- ../../ReWire/rewire-user
- ../../ReWire/rewire-base
