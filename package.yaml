name:                rwcrypto
version:             0.1.0.0
github:              "githubuser/rwcrypto"
license:             BSD-3-Clause
author:              "Author name here"
maintainer:          "example@example.com"
copyright:           "2025 Author name here"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/githubuser/rwcrypto#readme>

dependencies:
- base ^>= 4.20
# ReWire user-facing library (ReWire, ReWire.Bits, ...) and its shared base,
# built from the local checkout at ~/ReWire (see stack.yaml).
- rewire-user >= 0.2
- rewire-base
- ghc ^>= 9.10
- directory ^>= 1.3
- filepath ^>= 1.5
- lens ^>= 5.3
- text ^>= 2.1
- vector
- monad-resumption
- mtl
# Required by sources using {-# OPTIONS_GHC -fplugin GHC.TypeLits.Normalise #-}
# (e.g. src/sha256/SHA256.hs); without it GHC fails to find the plugin.
- ghc-typelits-natnormalise

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wno-name-shadowing
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  # Scoped to a set that builds cleanly. Add more source-dirs + exposed-modules
  # as you re-enable other ciphers (aes, salsa20, cubehash, pipelining, ...).
  source-dirs:
    - src
    - src/aes
    - src/blake2b
    - src/blake2b/Reference
    - src/sha256
    - src/keeloq
  exposed-modules:
    - SHA256
    # KeeLoq rolling-code models (src/keeloq). KeeLoq/KeeLoqLearn are plain
    # Haskell; the ReWire receiver lives in src/keeloq/rewire and is compiled
    # with rwc, not GHC (see src/keeloq/README.md).
    - KeeLoq
    - KeeLoqLearn

executables:
  rwcrypto-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - rwcrypto

tests:
  rwcrypto-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - rwcrypto
